name: Production Deployment

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:

env:
  REGISTRY: collegemanagementacr
  IMAGE_NAME: college-management
  AZURE_RESOURCE_GROUP: college-management-rg
  AZURE_CONTAINER_APP: college-management-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Azure
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Log in to Azure Container Registry
      run: |
        az acr login --name ${{ env.REGISTRY }}

    - name: Extract metadata
      id: meta
      run: |
        DOCKER_IMAGE=${{ env.REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}
        VERSION=$(date +%Y%m%d-%H%M%S)
        echo "image=${DOCKER_IMAGE}" >> $GITHUB_OUTPUT
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "tag=${DOCKER_IMAGE}:${VERSION}" >> $GITHUB_OUTPUT

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ steps.meta.outputs.tag }}
          ${{ env.REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-to-aks:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Log in to Azure
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Get AKS credentials
      run: |
        az aks get-credentials \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --name college-prod-aks \
          --overwrite-existing

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s/deployment.yaml
        kubectl set image deployment/college-management-app \
          college-management=${{ env.REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:latest \
          -n college-prod
        kubectl rollout status deployment/college-management-app -n college-prod --timeout=5m

    - name: Verify deployment
      run: |
        echo "Deployment Status:"
        kubectl get deployments -n college-prod
        kubectl get pods -n college-prod
        kubectl get services -n college-prod

  smoke-tests:
    needs: deploy-to-aks
    runs-on: ubuntu-latest
    
    steps:
    - name: Wait for service to be ready
      run: |
        sleep 30

    - name: Get service endpoint
      run: |
        SERVICE_IP=$(kubectl get service college-management-service -n college-prod -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        echo "SERVICE_IP=${SERVICE_IP}" >> $GITHUB_ENV

    - name: Health check
      run: |
        curl -f http://${{ env.SERVICE_IP }}:80/actuator/health || exit 1

    - name: Notification - Success
      if: success()
      run: |
        echo "✅ Production deployment successful!"

    - name: Notification - Failure
      if: failure()
      run: |
        echo "❌ Production deployment failed!"
        exit 1
