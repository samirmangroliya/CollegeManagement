spring.application.name=CollegeManagement
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database Configuration (uses environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/college_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:college_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:college_pass}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# JPA/Hibernate Configuration
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Flyway Configuration
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
