# ══════════════════════════════════════
#  PostgreSQL
# ══════════════════════════════════════
spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/college_management
spring.datasource.username=college_user
spring.datasource.password=college_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Disable Flyway for now
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ══════════════════════════════════════
#  MongoDB
# ══════════════════════════════════════
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=college_logs

# ══════════════════════════════════════
#  JWT
# ══════════════════════════════════════
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ══════════════════════════════════════
#  Logging
# ══════════════════════════════════════
logging.level.com.my.collegemanagement=DEBUG