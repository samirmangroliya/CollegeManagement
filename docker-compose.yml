services:
  postgres:
    image: postgres:15
    container_name: college_postgres
    environment:
      POSTGRES_DB: college_db
      POSTGRES_USER: college_user
      POSTGRES_PASSWORD: college_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    container_name: college_mongo
    environment:
      MONGO_INITDB_DATABASE: college_logs
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data: